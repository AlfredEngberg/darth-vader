<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/App.css">
    <link rel="stylesheet" href="/src/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joti+One&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div id="root"></div>
        <header>
            <nav>

                <h1><a href="/">Puffes Weather</a></h1>
                <div class="button-nav">
                    <ul class="nav-menu">
                        <li class="button nav-item"><a href="/om.html">about</a></li>
                        <li class="button nav-item"><a href="/kontakt.html">contact</a></li>
                    </ul>
                </div>

                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </nav>
        </header>
        <article class="card about container">
            <h1>About</h1>
            <p>Dis iz a website built ta provide ‘da kurrent weatha uv yer kurrent location. Our goal ere iz ta provide
                'da weatha so ya kan plan yer next attack on 'da 'umiez.</p>
        </article>
        <footer>
            <p>github: <a href="https://github.com/AlfredEngberg">AlfredEngberg</a></p>
        </footer>
    </main>
</body>

<script>
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');
    const container = document.querySelector('.container');

    hamburger.addEventListener('click', () => {
        console.log('clicked');
        hamburger.classList.toggle('active');
        container.classList.toggle('active');
        navMenu.classList.toggle('active');
    });

    document.querySelectorAll('.nav-link').forEach(n => n.
        addEventListener('click', () => {
            hamburger.classList.remove('active');
            container.classList.remove('active');
            navMenu.classList.remove('active');
        }));
</script>

</html>
